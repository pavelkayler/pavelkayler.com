    <style>
      html[data-site-loading="true"],
      html[data-site-loading="true"] body,
      html[data-navigation-loading="true"],
      html[data-navigation-loading="true"] body {
        overflow: hidden !important;
      }

      /* Shared neutral screen: available before the application bundle starts. */
      .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        background: #1e1e1e;
        color: #eee;
        outline: none;
        overscroll-behavior: contain;
        touch-action: none;
      }

      #site-loader {
        opacity: 1;
        visibility: visible;
        transition: opacity 360ms ease, visibility 360ms ease;
      }
      #site-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .site-loader-content {
        display: grid;
        justify-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        color: #eee;
        font: 14px/1.5 Arial, sans-serif;
      }
      .loading-percent { min-width: 4ch; font-variant-numeric: tabular-nums; }
      .loading-recovery {
        position: absolute;
        top: calc(50% + 74px);
        left: 50%;
        transform: translateX(-50%);
        width: min(400px, calc(100% - 48px));
        text-align: center;
        font: 13px/1.5 Arial, sans-serif;
      }
      .loading-recovery p { margin: 0 0 12px; }
      .loading-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .loading-actions button {
        color: #eee;
        background: #292929;
        border: 1px solid #666;
        padding: 10px 14px;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
      }
      .loading-actions button:disabled { opacity: .5; cursor: wait; }
      #site-loader-actions[hidden], #site-loader-retry[hidden], #site-loader-error[hidden] { display: none; }

      .site-loader-spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-top-color: rgba(255, 255, 255, 0.92);
        border-radius: 50%;
        animation: site-loader-spin 720ms linear infinite;
      }
      .route-loading-overlay { animation: loader-appear 150ms ease-out both; }
      html[data-navigation-loading="true"] .persistent-site-logo { view-transition-name: none; }
      @keyframes site-loader-spin { to { transform: rotate(360deg); } }
      @keyframes loader-appear { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        #site-loader { transition-duration: 0.001ms; }
        .route-loading-overlay { animation: none; }
        .site-loader-spinner { animation: none; border-color: rgba(255, 255, 255, 0.68); }
      }
    </style>

    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <!-- Site layout/theme CSS is frozen locally and shipped without builder/runtime dependencies. -->
    <link rel="stylesheet" href="%BASE_URL%site-theme.css" />
    <link rel="stylesheet" href="%BASE_URL%assets/styles/portfolio-layout.css" />
    <link rel="stylesheet" href="%BASE_URL%assets/styles/responsive.css" />
  </head>
  <body class="theme-polina -has-cover -color-scheme -scheme-dark -accented uc-page-type-page">
    <div id="site-loader" class="loading-overlay" aria-label="Загрузка сайта">
      <div class="site-loader-content">
        <span class="site-loader-spinner" aria-hidden="true"></span>
        <span id="site-loader-progress" class="loading-percent" role="progressbar"
          aria-label="Готовность сайта" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</span>
      </div>
      <div class="loading-recovery">
        <p id="site-loader-error" role="status" hidden>Не удалось загрузить часть файлов.</p>
        <div id="site-loader-actions" class="loading-actions" hidden>
          <button id="site-loader-retry" type="button" hidden>Повторить загрузку</button>
          <button id="site-loader-continue" type="button">Открыть доступную часть сайта</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
