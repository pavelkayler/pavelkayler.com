name: Apply staged preloading integration
on:
  push:
    branches: [feat/staged-site-preloading]
    paths: [.github/workflows/apply-staged-preloading.yml, scripts/apply-staged-preloading-once.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/staged-site-preloading'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply integration on feature branch only
        run: python3 scripts/apply-staged-preloading-once.py
      - run: npm ci --no-audit --no-fund
      - name: Compile and test queue before saving source
        run: |
          npm run build
          node --experimental-strip-types --test scripts/resource-queue.test.ts
          python3 -m py_compile scripts/preload-smoke.py scripts/browser-smoke.py scripts/home_gallery_checks.py
      - name: Save source without publishing or modifying workflows
        run: |
          test "$(git ls-remote origin refs/heads/feat/staged-site-preloading | cut -f1)" = "$GITHUB_SHA"
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire readiness-based startup, priority navigation and cold-cache regression tests'
          git push origin HEAD:refs/heads/feat/staged-site-preloading
