name: Validate React V2

on:
  push:
    branches:
      - react-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build React SPA
        env:
          VITE_BASE_PATH: /pavelkayler.com/
        run: npm run build
      - name: Check SPA output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/legacy-theme.css
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -d dist/_app
          test -f dist/works/index.html
          test -f dist/portraits/index.html
          test -f dist/projects/index.html
          test -f dist/brands/index.html
          test -f dist/contacts/index.html
          test -d dist/assets/social
          test "$(find dist/assets/social -type f | wc -l)" -eq 6
          grep -q "page-header" dist/legacy-theme.css
          grep -q "\.cover" dist/legacy-theme.css

          grep -q 'https://pavelkayler.com/' dist/index.html
          grep -q 'https://pavelkayler.com/works/' dist/works/index.html
          grep -q 'https://pavelkayler.com/portraits/' dist/portraits/index.html
          grep -q 'https://pavelkayler.com/projects/' dist/projects/index.html
          grep -q 'https://pavelkayler.com/brands/' dist/brands/index.html
          grep -q 'https://pavelkayler.com/contacts/' dist/contacts/index.html
          grep -q 'ПОРТРЕТЫ | PAVEL KAYLER' dist/portraits/index.html
          grep -q 'name="description"' dist/brands/index.html
          grep -q 'name="twitter:card"' dist/works/index.html
          grep -q 'property="og:image"' dist/projects/index.html
          grep -q '<loc>https://pavelkayler.com/works/</loc>' dist/sitemap.xml
          ! grep -q '\.html</loc>' dist/sitemap.xml || exit 1
          grep -q 'Sitemap: https://pavelkayler.com/sitemap.xml' dist/robots.txt
          grep -q 'Страница не найдена | PAVEL KAYLER' dist/404.html
          grep -q 'noindex, nofollow' dist/404.html
          ! grep -q 'rel="canonical"' dist/404.html || exit 1
          ! grep -q 'property="og:image"' dist/404.html || exit 1
          ! grep -q 'data-seo-schema' dist/404.html || exit 1
          grep -q 'NotFoundPage' src/app/router.tsx
          ! grep -q '<Navigate' src/app/router.tsx || exit 1

          test -f dist/assets/mobile-overrides.css
          test -f dist/assets/folio/desktop/vendor/polina-3994a6f8acd9e18fe38b14dbbad877484965df0633ca7776ab996d2430e39a9f.css
          test -f dist/assets/custom-icons-cb5906d824b59115b50c97eba5c0ee88aa5a4acb1a3af5a672f988e36a617629.woff2
          test -f dist/assets/font-awesome/fa-light-300-e773295f27b81341e6948427170f7e29e2efac0aa00f9288185dc22da580ee56.woff2
          test ! -d dist/assets/flags
          test ! -d dist/assets/folio/desktop/themes
          if find dist/assets -type f -name '*.js' -print -quit | grep -q .; then
            echo "Unexpected legacy JavaScript shipped under dist/assets"
            exit 1
          fi

          test -d dist/assets/fonts/oswald
          test "$(find dist/assets/fonts/oswald -type f -name '*.woff2' | wc -l)" -eq 10
          test -f dist/assets/fonts/oswald/TK3_WkUHHAIjg75cFRf3bXL8LICs1_FvsUJiZTaR.woff2
          test -f dist/assets/fonts/oswald/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUJiZTaR.woff2
          grep -q 'assets/fonts/oswald/' dist/legacy-theme.css

          python3 - <<'PY'
          from pathlib import Path
          import re

          remote_wfolio = re.compile(r"(?i)(?:https?:)?//[^\"'\s)>]*wfolio\.ru")
          remote_google_fonts = re.compile(r"(?i)fonts\.(?:gstatic|googleapis)\.com")
          hits = []

          for suffix in ('*.html', '*.css', '*.js'):
              for path in Path('dist').rglob(suffix):
                  text = path.read_text('utf-8', errors='ignore')
                  for pattern, label in ((remote_wfolio, 'remote Wfolio'), (remote_google_fonts, 'Google Fonts')):
                      match = pattern.search(text)
                      if match:
                          hits.append((str(path), label, match.group(0)))

          if hits:
              for path, label, value in hits:
                  print(f'{label} URL remains in {path}: {value}')
              raise SystemExit('Production still contains remote service dependencies')

          print('No remote Wfolio or Google Fonts URLs in production text assets')
          PY

          test ! -f src/components/LegacyPage.tsx
          test ! -f src/generated/structured.ts
          ! grep -R "dangerouslySetInnerHTML" src --include='*.ts' --include='*.tsx' || exit 1
          ! grep -R "generated/structured" src --include='*.ts' --include='*.tsx' || exit 1
          ! grep -q "html: string" src/generated/pages.ts || exit 1
          grep -q "applyPageMetadata" src/layouts/MainLayout.tsx

          MAX_BYTES=$((850 * 1024 * 1024))
          ACTUAL_BYTES=$(du -sb dist | cut -f1)
          echo "Production size: $ACTUAL_BYTES bytes (budget: $MAX_BYTES bytes)"
          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "React production exceeds the 850 MiB Pages budget"
            exit 1
          fi

          du -sh dist
          echo "React V2 split native build with SEO metadata is valid"
      - name: Report largest production assets
        run: |
          echo "Largest 30 production files:"
          find dist -type f -printf '%s\t%p\n' \
            | sort -nr \
            | head -n 30 \
            | numfmt --field=1 --to=iec-i --suffix=B

          echo
          echo "Production bytes by asset family:"
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          totals = defaultdict(int)
          counts = defaultdict(int)
          root = Path('dist')

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              parts = rel.parts
              if parts and parts[0] in {'i.wfolio.ru', 'static.wfolio.ru', 'vp.wfolio.ru'}:
                  family = parts[0]
              elif parts and parts[0] == '_app':
                  family = '_app'
              elif parts and parts[0] == 'assets':
                  family = 'assets'
              else:
                  family = 'html/seo/other'
              totals[family] += path.stat().st_size
              counts[family] += 1

          for family, size in sorted(totals.items(), key=lambda item: item[1], reverse=True):
              print(f'{family:18} {size / 1024 / 1024:9.1f} MiB  ({counts[family]} files)')
          PY
