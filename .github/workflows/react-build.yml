name: Validate production site
on:
  pull_request:
    branches: [main]
  push:
    branches: [maintenance/standalone-source-2026-09-09]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production site
        env:
          VITE_BASE_PATH: /
        run: npm run build
      - name: Install media and browser tools
        run: |
          bash scripts/prepare-ci-apt.sh
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Apply production media optimization
        run: |
          node scripts/optimize-production-media.mjs
          python3 scripts/optimize-production-images.py
      - name: Validate standalone output
        run: bash scripts/validate-production.sh
      - name: Desktop and mobile browser regression gate
        run: bash scripts/run-browser-checks.sh
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-browser-${{ github.run_attempt }}
          path: test-results/browser
          retention-days: 7
