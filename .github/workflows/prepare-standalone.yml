name: Prepare verified standalone source
on:
  push:
    branches: [maintenance/standalone-source-2026-09-09]
    paths: [.github/workflows/prepare-standalone.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: standalone-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: maintenance/standalone-source-2026-09-09
          fetch-depth: 1
      - name: Diagnose previous publication failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/pavelkayler/pavelkayler.com/actions/jobs/101005702659/logs > "$RUNNER_TEMP/previous-cleanup.log" || true
          tail -n 45 "$RUNNER_TEMP/previous-cleanup.log" | grep -Ei 'error|fatal|rejected|refusing|failed|permission|workflow|push|rebase' || true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install and build the unchanged source
        env:
          VITE_BASE_PATH: /
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Record immutable media and content baseline
        run: python3 scripts/prepare-standalone.py snapshot
      - name: Freeze source and prepare final workflows
        run: |
          python3 scripts/prepare-standalone.py freeze
          bash -n scripts/check-live-site.sh
          python3 -m py_compile scripts/browser-smoke.py
      - name: Build without the migration archive and verify preservation
        env:
          VITE_BASE_PATH: /
        run: |
          npm run build
          python3 scripts/prepare-standalone.py verify
      - name: Publish source only to the isolated maintenance branch
        run: |
          # Workflow definitions are reviewed and committed separately through the
          # repository integration; the runner cannot grant itself workflow access.
          git restore --source=HEAD --staged --worktree .github
          rm scripts/prepare-standalone.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat | tail -n 1
          git diff --cached --check > "$RUNNER_TEMP/whitespace-check.txt" 2>&1 || { tail -n 30 "$RUNNER_TEMP/whitespace-check.txt"; exit 1; }
          if git diff --cached --name-only | grep -E '^(node_modules/|dist/|test-results/)|(^|/)__pycache__/'; then
            echo 'Build products must not enter source control'
            exit 1
          fi
          git commit -m 'Freeze standalone content and relocate unchanged media' --quiet
          git push origin HEAD:maintenance/standalone-source-2026-09-09
          git rev-parse HEAD | tee "$RUNNER_TEMP/standalone-review/source-commit.txt"
      - name: Install browser test tools
        run: |
          python3 -m pip install --quiet playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Test built site in desktop Chromium and mobile Chromium and WebKit
        env:
          QA_WEBKIT: 1
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/qa-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 1
          python3 scripts/browser-smoke.py
      - name: Verify live HTTPS independently of source changes
        if: ${{ !cancelled() }}
        env:
          SMOKE_ATTEMPTS: 2
        run: bash scripts/check-live-site.sh
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-review
          path: |
            ${{ runner.temp }}/standalone-review
            test-results/browser
          retention-days: 7
