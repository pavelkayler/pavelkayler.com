name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production site
        env:
          VITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
        run: |
          npm run build
          python3 -c "import json,os,pathlib; pathlib.Path('dist/build-info.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA']}))"
      - name: Install media and browser tools
        run: |
          bash scripts/prepare-ci-apt.sh
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Optimize production media
        run: |
          node scripts/optimize-production-media.mjs
          python3 scripts/optimize-production-images.py
      - name: Validate production output
        run: bash scripts/validate-production.sh
      - name: Browser gate before publication
        run: bash scripts/run-browser-checks.sh
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-${{ github.run_attempt }}
          path: test-results/browser
          retention-days: 7
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Require valid HTTPS, canonical redirects and exact release
        run: EXPECTED_COMMIT="$GITHUB_SHA" bash scripts/check-live-site.sh
      - name: Install live browser test tools
        run: |
          bash scripts/prepare-ci-apt.sh
          python3 -m pip install --quiet playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Check published navigation and galleries
        env:
          QA_WEBKIT: 1
        run: python3 scripts/browser-smoke.py --base https://pavelkayler.com --output test-results/live
      - name: Save live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-${{ github.run_attempt }}
          path: test-results/live
          retention-days: 7
