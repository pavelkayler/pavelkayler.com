name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build production site
        env:
          # configure-pages reports /pavelkayler.com for the current project-site URL
          # and an empty base path after pavelkayler.com becomes the Pages custom domain.
          # format() therefore yields /pavelkayler.com/ today and / after cutover.
          VITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
        run: npm run build

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Optimize production media
        run: |
          node scripts/optimize-production-media.mjs
          python3 scripts/optimize-production-images.py

      - name: Validate production output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/legacy-theme.css
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -d dist/_app
          test -f dist/works/index.html
          test -f dist/portraits/index.html
          test -f dist/projects/index.html
          test -f dist/brands/index.html
          test -f dist/contacts/index.html
          test -d dist/assets/social
          test "$(find dist/assets/social -type f | wc -l)" -eq 6
          grep -q "page-header" dist/legacy-theme.css
          grep -q "\.cover" dist/legacy-theme.css

          grep -q 'https://pavelkayler.com/' dist/index.html
          grep -q 'https://pavelkayler.com/works/' dist/works/index.html
          grep -q 'https://pavelkayler.com/portraits/' dist/portraits/index.html
          grep -q 'https://pavelkayler.com/projects/' dist/projects/index.html
          grep -q 'https://pavelkayler.com/brands/' dist/brands/index.html
          grep -q 'https://pavelkayler.com/contacts/' dist/contacts/index.html
          grep -q '<loc>https://pavelkayler.com/works/</loc>' dist/sitemap.xml
          ! grep -q '\.html</loc>' dist/sitemap.xml || exit 1
          grep -q 'Sitemap: https://pavelkayler.com/sitemap.xml' dist/robots.txt
          grep -q 'noindex, nofollow' dist/404.html

          test -f dist/assets/mobile-overrides.css
          test -f dist/assets/folio/desktop/vendor/polina-3994a6f8acd9e18fe38b14dbbad877484965df0633ca7776ab996d2430e39a9f.css
          test ! -d dist/assets/flags
          test ! -d dist/assets/folio/desktop/themes
          if find dist/assets -type f -name '*.js' -print -quit | grep -q .; then
            echo "Unexpected legacy JavaScript shipped under dist/assets"
            exit 1
          fi

          test -d dist/assets/fonts/oswald
          test "$(find dist/assets/fonts/oswald -type f -name '*.woff2' | wc -l)" -eq 10
          grep -q 'assets/fonts/oswald/' dist/legacy-theme.css

          python3 - <<'PY'
          from pathlib import Path
          import re

          remote_wfolio = re.compile(r"(?i)(?:https?:)?//[^\"'\s)>]*wfolio\.ru")
          remote_google_fonts = re.compile(r"(?i)fonts\.(?:gstatic|googleapis)\.com")
          hits = []

          for suffix in ('*.html', '*.css', '*.js'):
              for path in Path('dist').rglob(suffix):
                  text = path.read_text('utf-8', errors='ignore')
                  for pattern, label in ((remote_wfolio, 'remote Wfolio'), (remote_google_fonts, 'Google Fonts')):
                      match = pattern.search(text)
                      if match:
                          hits.append((str(path), label, match.group(0)))

          if hits:
              for path, label, value in hits:
                  print(f'{label} URL remains in {path}: {value}')
              raise SystemExit('Production still contains remote service dependencies')

          print('No remote Wfolio or Google Fonts URLs in production text assets')
          PY

          MAX_BYTES=$((850 * 1024 * 1024))
          ACTUAL_BYTES=$(du -sb dist | cut -f1)
          echo "Production size: $ACTUAL_BYTES bytes (budget: $MAX_BYTES bytes)"
          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Production exceeds the 850 MiB Pages budget"
            exit 1
          fi

          du -sh dist
          echo "Production output is ready for Pages"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify live production routes
        run: |
          set -euo pipefail

          routes=(
            '/'
            '/works/'
            '/portraits/'
            '/projects/'
            '/brands/'
            '/contacts/'
            '/robots.txt'
            '/sitemap.xml'
          )

          for attempt in $(seq 1 12); do
            echo "Production smoke-test attempt $attempt/12"
            failed=0

            for route in "${routes[@]}"; do
              code=$(curl --silent --show-error \
                --location \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 10 \
                --max-time 30 \
                "http://pavelkayler.com${route}" || true)

              echo "$code  http://pavelkayler.com${route}"
              if [ "$code" != '200' ]; then
                failed=1
              fi
            done

            missing_code=$(curl --silent --show-error \
              --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 30 \
              'http://pavelkayler.com/__github_pages_smoke_missing__' || true)
            echo "$missing_code  http://pavelkayler.com/__github_pages_smoke_missing__"
            if [ "$missing_code" != '404' ]; then
              failed=1
            fi

            if [ "$failed" -eq 0 ]; then
              echo "Production smoke test passed: core routes are reachable and the missing route returns 404"
              break
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Production is still propagating; retrying in 15 seconds"
              sleep 15
            else
              echo "Production smoke test failed after retries"
              exit 1
            fi
          done

      - name: Report HTTPS readiness
        run: |
          set -euo pipefail

          https_code=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            'https://pavelkayler.com/' || true)

          http_result=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            --connect-timeout 10 \
            --max-time 30 \
            'http://pavelkayler.com/' || true)

          echo "HTTPS root status: $https_code"
          echo "HTTP root result: $http_result"

          http_code=${http_result%% *}
          redirect_url=${http_result#* }

          if [ "$https_code" = '200' ] && \
             { [ "$http_code" = '301' ] || [ "$http_code" = '302' ] || [ "$http_code" = '307' ] || [ "$http_code" = '308' ]; } && \
             [[ "$redirect_url" == https://pavelkayler.com/* ]]; then
            echo "HTTPS is active and HTTP is redirected to HTTPS"
          else
            echo "::warning::HTTPS is not enforced yet. Enable Enforce HTTPS in Settings → Pages after GitHub finishes provisioning the certificate."
          fi
