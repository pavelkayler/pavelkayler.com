name: Deploy migration preview to Pages

on:
  push:
    branches:
      - wfolio-migration
    paths:
      - index.html
      - works.html
      - portraits.html
      - projects.html
      - brands.html
      - contacts.html
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: wfolio-migration

      - name: Generate standalone preview
        run: python3 scripts/migrate_wfolio.py

      - name: Validate preview
        run: python3 scripts/validate_migration.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare publish-only directory
        run: |
          mkdir -p _site
          cp index.html works.html portraits.html projects.html brands.html contacts.html favicon.ico robots.txt sitemap.xml .nojekyll _site/
          cp -a assets i.wfolio.ru _site/

          for dir in static.wfolio.ru vp.wfolio.ru mc.yandex.ru; do
            if [ -d "$dir" ]; then
              cp -a "$dir" _site/
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
