# Preview revision: responsive-mobile-2026-09-02
name: Publish Wfolio migration preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-preview-main.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: wfolio-migration

      - name: Validate standalone migration
        run: |
          python3 scripts/validate_migration.py
          python3 scripts/validate_responsive.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish-only directory
        run: |
          mkdir -p _site
          cp index.html works.html portraits.html projects.html brands.html contacts.html favicon.ico robots.txt sitemap.xml .nojekyll _site/
          cp -a assets i.wfolio.ru _site/

          for dir in static.wfolio.ru vp.wfolio.ru mc.yandex.ru; do
            if [ -d "$dir" ]; then
              cp -a "$dir" _site/
            fi
          done

          echo "Preview size before optimization:"
          du -sh _site

      - name: Optimize preview images for Pages limit
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os

          root = Path("_site")
          target = 850 * 1024 * 1024

          def tree_size():
              return sum(p.stat().st_size for p in root.rglob("*") if p.is_file())

          def optimize_jpeg(path: Path, max_dim: int, quality: int) -> bool:
              before = path.stat().st_size
              tmp = path.with_name(path.name + ".preview-tmp")
              try:
                  with Image.open(path) as source:
                      image = ImageOps.exif_transpose(source)
                      if image.mode not in ("RGB", "L"):
                          image = image.convert("RGB")
                      if max(image.size) > max_dim:
                          image.thumbnail((max_dim, max_dim), Image.Resampling.LANCZOS)
                      kwargs = {
                          "format": "JPEG",
                          "quality": quality,
                          "optimize": True,
                          "progressive": True,
                      }
                      icc = source.info.get("icc_profile")
                      if icc:
                          kwargs["icc_profile"] = icc
                      image.save(tmp, **kwargs)
                  after = tmp.stat().st_size
                  if after < before:
                      os.replace(tmp, path)
                      return True
                  tmp.unlink(missing_ok=True)
              except Exception as exc:
                  tmp.unlink(missing_ok=True)
                  print(f"warning: could not optimize {path}: {exc}")
              return False

          def run_pass(max_dim: int, quality: int, min_size: int):
              files = sorted(
                  (
                      p for p in root.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in {".jpg", ".jpeg"}
                      and p.stat().st_size >= min_size
                  ),
                  key=lambda p: p.stat().st_size,
                  reverse=True,
              )
              changed = 0
              for idx, path in enumerate(files, 1):
                  if tree_size() <= target:
                      break
                  if optimize_jpeg(path, max_dim, quality):
                      changed += 1
                  if idx % 50 == 0:
                      print(f"processed {idx}/{len(files)}, current size={tree_size()/1024/1024:.1f} MiB")
              print(f"pass max_dim={max_dim} quality={quality}: changed={changed}, size={tree_size()/1024/1024:.1f} MiB")

          start = tree_size()
          print(f"Starting preview size: {start/1024/1024:.1f} MiB")

          if start > target:
              run_pass(max_dim=2560, quality=82, min_size=900 * 1024)
          if tree_size() > target:
              run_pass(max_dim=2200, quality=76, min_size=500 * 1024)
          if tree_size() > target:
              run_pass(max_dim=1920, quality=72, min_size=0)

          final = tree_size()
          print(f"Final preview size: {final/1024/1024:.1f} MiB")
          if final > target:
              raise SystemExit(f"Preview is still too large: {final} bytes > {target} bytes")
          PY

          echo "Preview size after optimization:"
          du -sh _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
