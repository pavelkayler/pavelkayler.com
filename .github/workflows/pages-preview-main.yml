# Preview revision: react-v2-d0a28ea-2026-09-02
name: Publish React V2 preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-preview-main.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out React V2 branch
        uses: actions/checkout@v6
        with:
          ref: react-v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build React SPA
        env:
          VITE_BASE_PATH: /pavelkayler.com/
        run: npm run build

      - name: Validate React SPA output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/legacy-theme.css
          test -d dist/_app
          test -f dist/works/index.html
          test -f dist/portraits/index.html
          test -f dist/projects/index.html
          test -f dist/brands/index.html
          test -f dist/contacts/index.html
          grep -q "page-header" dist/legacy-theme.css
          grep -q "\.cover" dist/legacy-theme.css
          ! grep -R "wfolio.ru/card" dist/index.html dist/_app || exit 1
          test ! -f src/components/LegacyPage.tsx
          ! grep -R "dangerouslySetInnerHTML" src --include='*.ts' --include='*.tsx' || exit 1
          ! grep -q "html: string" src/generated/pages.ts || exit 1
          echo "Native React SPA output is valid"
          du -sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Keep Pages preview below site-size limit
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os

          root = Path("dist")
          target = 850 * 1024 * 1024

          def tree_size():
              return sum(p.stat().st_size for p in root.rglob("*") if p.is_file())

          def optimize_jpeg(path: Path, max_dim: int, quality: int) -> bool:
              before = path.stat().st_size
              tmp = path.with_name(path.name + ".preview-tmp")
              try:
                  with Image.open(path) as source:
                      image = ImageOps.exif_transpose(source)
                      if image.mode not in ("RGB", "L"):
                          image = image.convert("RGB")
                      if max(image.size) > max_dim:
                          image.thumbnail((max_dim, max_dim), Image.Resampling.LANCZOS)
                      kwargs = {
                          "format": "JPEG",
                          "quality": quality,
                          "optimize": True,
                          "progressive": True,
                      }
                      icc = source.info.get("icc_profile")
                      if icc:
                          kwargs["icc_profile"] = icc
                      image.save(tmp, **kwargs)
                  after = tmp.stat().st_size
                  if after < before:
                      os.replace(tmp, path)
                      return True
                  tmp.unlink(missing_ok=True)
              except Exception as exc:
                  tmp.unlink(missing_ok=True)
                  print(f"warning: could not optimize {path}: {exc}")
              return False

          def run_pass(max_dim: int, quality: int, min_size: int):
              files = sorted(
                  (
                      p for p in root.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in {".jpg", ".jpeg"}
                      and p.stat().st_size >= min_size
                  ),
                  key=lambda p: p.stat().st_size,
                  reverse=True,
              )
              changed = 0
              for idx, path in enumerate(files, 1):
                  if tree_size() <= target:
                      break
                  if optimize_jpeg(path, max_dim, quality):
                      changed += 1
                  if idx % 50 == 0:
                      print(f"processed {idx}/{len(files)}, current size={tree_size()/1024/1024:.1f} MiB")
              print(f"pass max_dim={max_dim} quality={quality}: changed={changed}, size={tree_size()/1024/1024:.1f} MiB")

          start = tree_size()
          print(f"Starting React preview size: {start/1024/1024:.1f} MiB")
          if start > target:
              run_pass(max_dim=2560, quality=84, min_size=900 * 1024)
          if tree_size() > target:
              run_pass(max_dim=2200, quality=80, min_size=500 * 1024)
          if tree_size() > target:
              run_pass(max_dim=1920, quality=76, min_size=0)

          final = tree_size()
          print(f"Final React preview size: {final/1024/1024:.1f} MiB")
          if final > target:
              raise SystemExit(f"React preview is still too large: {final} bytes > {target} bytes")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
