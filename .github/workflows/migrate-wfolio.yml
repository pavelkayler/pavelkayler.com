name: Migrate Wfolio mirror

on:
  push:
    branches:
      - wfolio-migration
    paths:
      - scripts/migrate_wfolio.py
      - scripts/validate_migration.py
      - .github/workflows/migrate-wfolio.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: wfolio-migration
          fetch-depth: 0

      - name: Localize Wfolio assets and clean HTML
        run: python3 scripts/migrate_wfolio.py

      - name: Validate generated standalone site
        run: python3 scripts/validate_migration.py

      - name: Commit generated standalone site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Generate autonomous Wfolio migration"

          for attempt in 1 2 3; do
            git fetch origin wfolio-migration

            if ! git merge-base --is-ancestor origin/wfolio-migration HEAD; then
              git rebase origin/wfolio-migration
            fi

            if git push origin HEAD:wfolio-migration; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying after refreshing the branch"
            sleep 2
          done

          echo "Unable to push generated site after three attempts"
          exit 1
