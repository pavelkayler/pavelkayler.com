name: Migrate Wfolio mirror

on:
  push:
    branches:
      - wfolio-migration
    paths:
      - scripts/migrate_wfolio.py
      - .github/workflows/migrate-wfolio.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: wfolio-migration
          fetch-depth: 0

      - name: Localize Wfolio assets and clean HTML
        run: python3 scripts/migrate_wfolio.py

      - name: Commit generated standalone site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate autonomous Wfolio migration"
          git push origin HEAD:wfolio-migration
